# Railway config-as-code for the `dcp-extract-all` cron service.
# Point the service's "Config Path" (Settings > Config as code) at this file.
# Still set per-service env in the dashboard:
#   MONITOR_NAME=dcp-extract-all, DATABASE_URL, R2_ACCOUNT_ID, R2_BUCKET_NAME,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   (optional) HC_PING_URL.
#
# Runs dcp_extract_changed.py --all --review: re-extracts EVERY active chapter and
# diffs it against the approved baseline (regulatory_provisions WHERE is_current = TRUE),
# enqueueing real value changes to dcp_review_queue. NO provision commit.
#
# MANUAL ONLY from 2026-10-02 (user decision). NO cronSchedule, here or on Railway --
# the live schedule was set to null the same day and read back to confirm.
#
# It was quarterly, and the reason written here was: "decoupled from the noisy
# byte-change trigger so a re-exported-but-identical PDF produces zero queue items,
# and a silent in-place amendment (no byte change) is still caught."
#
# BOTH HALVES OF THAT ARE NOW DONE ELSEWHERE OR IMPOSSIBLE.
#
# The re-export half is handled, and better: `r2_monitor` pulls the OLD pdf back out
# of R2 and compares normalised text (`scripts/pdf_text_hash.is_reexport`). Bytes
# differ, text identical -> logged as a re-export, no re-extraction, no queue row, and
# `provisions_extracted_from_hash` is advanced so DQ-70 records no false entry. So the
# noisy trigger this was decoupled from is no longer noisy.
#
# The silent-amendment half cannot happen. The detector compares TEXT. A content edit
# always changes the text, so it is always caught. An edit that does not change the
# text is not an edit. There was nothing here for this pass to find.
#
# WHAT IT WAS ACTUALLY DOING, measured 2026-10-02: re-reading 253 chapters / 9,841
# pages whether or not anything changed, with a reader that is a language model and
# therefore NOT deterministic. Same pdf, same code, three runs of city_of_sydney
# `schedules` gave 559 sections, 626 sections, and two refusals. The diff pairs a rule
# to its old version by clause number, so a re-split section matches nothing and is
# reported as a deletion plus an insertion. Result: 29,019 review-queue rows in 30
# days across 76 chapters, every one from a pdf that had NOT changed -- 94% of them
# `added`/`removed` pairs, which is that re-splitting. That is the OpenAI bill, the
# Railway build and run time, and the review backlog the watchdog keeps reporting as
# "awaiting REVIEW, flagged 13d ago".
#
# It also could NOT have caught the one real gap. Randwick DCP 2025 was in force for
# seven weeks unnoticed because the council published a NEW file and left the old one
# alone. Re-reading the old file says nothing about a file we have never seen; that is
# hub discovery's job (`ce-dcp-new-source-discovery-gap-2026-09-27.md`, DQ-118).
#
# STILL THE RIGHT TOOL, BY HAND: re-reading after WE improve the reader. That is a
# regression check on our own work, not a council change, so it is run deliberately and
# per-chapter -- `--chapter <key>`, never `--all` unscoped:
#     python scripts/dcp_extract_changed.py --review --council <c> --chapter <k>
[build]
dockerfilePath = "Dockerfile.monitors"

[deploy]
# A NO-OP ON PURPOSE. Measured 2026-10-02, an hour after the cron was removed:
# merging PR #1200 changed this file, Railway redeployed the service, and WITHOUT a
# cronSchedule it started the container immediately and ran run_monitors.py. The
# Telegram dead-man's-switch warning is how we found out. It extracted nothing -- 0
# queue rows, 0 url checks, 0 registry writes in the following hour -- and the
# deployment was removed, so it cost nothing. But "manual only" is NOT achieved by
# deleting the schedule alone: any merge touching a file this service watches would
# have started a 253-chapter, 9,841-page re-read unattended.
#
# So the start command no longer invokes the reader. A deploy prints how to run it and
# exits 0. The real run is deliberate and local, with Railway's env -- which is how it
# has to be anyway, because `railway run` executes the LOCAL checkout
# (memory/feedback-dry-run-does-not-cover-the-review-queue.md). Nothing is lost.
#
# tests/test_railway_cron_drift.py asserts this is a single echo that cannot chain a
# second command, so restoring an executable command is a test failure rather than a
# surprise on the next merge.
startCommand = "echo 'MANUAL ONLY. See railway.dcp-extract-all.toml. A deploy must not run a 253-chapter re-read. Run it deliberately, one named chapter at a time.'"
restartPolicyType = "NEVER"        # run to completion, do not restart
