# prior-art-checked: deliberate clean-room OSS extraction; standalone package must not import project code (see oss/prose-gate/EXTRACTION.md)
name: prose-gate
description: Diff-aware linter for risky assurance language in user-facing text
branding:
  icon: shield
  color: orange
inputs:
  diff-base:
    description: Git ref to diff against (checkout must use fetch-depth 0)
    required: false
    default: origin/main
  config:
    description: Path to a .prose-gate.toml (defaults to repo root discovery)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        pip install --quiet "${{ github.action_path }}"
        args=(--diff-base "${{ inputs.diff-base }}" --format github)
        if [ -n "${{ inputs.config }}" ]; then
          args+=(--config "${{ inputs.config }}")
        fi
        prose-gate "${args[@]}"
