<!DOCTYPE html>
<html>
<head>
    <title>Google Autocomplete Test</title>
    <style>
        #autocomplete {
            width: 400px;
            height: 40px;
            font-size: 16px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #results {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #eee;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Google Places Autocomplete Test</h1>
    <p>Testing with the same API key used in the compliance engine:</p>
    
    <input id="autocomplete" placeholder="Start typing an address in NSW..." />
    
    <div id="results">
        <h3>Debug Info:</h3>
        <div id="debug"></div>
    </div>

    <script>
        let autocomplete;
        const debugDiv = document.getElementById('debug');
        
        function log(message) {
            console.log(message);
            debugDiv.innerHTML += '<div>' + message + '</div>';
        }
        
        function initAutocomplete() {
            log('Initializing Google Places Autocomplete...');
            
            const input = document.getElementById('autocomplete');
            
            if (!window.google) {
                log('❌ Google Maps API not loaded');
                return;
            }
            
            if (!window.google.maps) {
                log('❌ Google Maps not available');
                return;
            }
            
            if (!window.google.maps.places) {
                log('❌ Google Places library not available');
                return;
            }
            
            try {
                log('✅ Google Maps API loaded successfully');
                log('✅ Google Places library loaded successfully');
                
                // NSW bounds
                const nswBounds = new google.maps.LatLngBounds(
                    new google.maps.LatLng(-37.5, 140.9), // SW corner
                    new google.maps.LatLng(-28.1, 153.6)  // NE corner  
                );
                
                autocomplete = new google.maps.places.Autocomplete(input, {
                    types: ['address'],
                    componentRestrictions: { country: 'au' },
                    bounds: nswBounds,
                    fields: ['formatted_address', 'geometry', 'address_components']
                });
                
                autocomplete.addListener('place_changed', function() {
                    const place = autocomplete.getPlace();
                    log('📍 Place selected: ' + (place.formatted_address || 'No address'));
                    
                    if (place.geometry) {
                        log('📍 Coordinates: ' + place.geometry.location.lat() + ', ' + place.geometry.location.lng());
                    }
                });
                
                log('✅ Autocomplete initialized successfully!');
                input.placeholder = 'Start typing an address... (autocomplete ready)';
                
            } catch (error) {
                log('❌ Error initializing autocomplete: ' + error.message);
                console.error('Autocomplete error:', error);
            }
        }
        
        // Load Google Maps API
        function loadGoogleMaps() {
            log('Loading Google Maps API...');
            
            const script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCi5UBAg6X-k6W8v1vv9XEQaML9aQE-w60&libraries=places&callback=initAutocomplete';
            script.onerror = function() {
                log('❌ Failed to load Google Maps API');
            };
            document.head.appendChild(script);
        }
        
        // Start the test
        loadGoogleMaps();
    </script>
</body>
</html>
