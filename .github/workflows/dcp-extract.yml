name: DCP Chapter Extraction

on:
  # Auto-trigger after monitor completes — always runs in REVIEW mode.
  # The monitor uses a matrix strategy (one job per council), so this
  # triggers once the overall workflow completes (not per-matrix-job).
  # Generates a review artifact for human inspection. No DB writes.
  # To commit reviewed provisions to production, use dcp-commit.yml manually.
  workflow_run:
    workflows: ["DCP Chapter Monitor"]
    types: [completed]

  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (extract but no DB writes) — pass "true" or "false"'
        required: false
        default: 'false'

jobs:
  extract:
    name: Extract changed DCP chapters (review mode)
    runs-on: ubuntu-latest
    # Only run after a clean monitor completion — not after monitor errors
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-extract.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-extract.txt

      - name: Build extraction arguments
        id: args
        run: |
          ARGS="--review"
          if [ -n "${{ github.event.inputs.council }}" ]; then
            ARGS="$ARGS --council ${{ github.event.inputs.council }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run DCP extraction (review mode — no DB writes)
        id: extract
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python scripts/dcp_extract_changed.py ${{ steps.args.outputs.args }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload review file as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcp-review-${{ github.run_id }}
          path: reviews/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report outcome
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CODE=${{ steps.extract.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "Nothing to extract — no chapters with needs_extraction=TRUE."
          elif [ "$CODE" = "2" ]; then
            echo "Review file generated. Download from artifacts and inspect before committing."
            echo "To commit: Actions -> DCP Commit Reviewed Provisions -> Run workflow"
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              MSG="DCP Review ready\nDownload review file, inspect provisions, then run:\nActions -> DCP Commit Reviewed Provisions\n\nArtifact: ${RUN_URL}"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MSG}\"}"
            fi
          else
            echo "Extraction failed with exit code $CODE."
            exit 1
          fi
