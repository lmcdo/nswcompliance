name: DCP Chapter Extraction

on:
  # Auto-trigger after every DCP Chapter Monitor run
  # First thing the script does is check needs_extraction=TRUE — exits 0 if nothing to do
  workflow_run:
    workflows: ["DCP Chapter Monitor"]
    types: [completed]

  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (extract but no DB writes)'
        required: false
        type: boolean
        default: false

jobs:
  extract:
    name: Extract changed DCP chapters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-extract.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-extract.txt

      - name: Build extraction arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.council }}" ]; then
            ARGS="$ARGS --council ${{ github.event.inputs.council }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run DCP extraction
        id: extract
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python scripts/dcp_extract_changed.py ${{ steps.args.outputs.args }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        # Exit code 2 = extracted successfully — not a failure, just informational
        continue-on-error: true

      - name: Report outcome
        run: |
          CODE=${{ steps.extract.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "✅ Nothing to extract. All chapters are current."
          elif [ "$CODE" = "2" ]; then
            echo "✅ Extraction complete. Provisions updated in database."
          else
            echo "❌ Extraction failed with exit code $CODE."
            exit 1
          fi
