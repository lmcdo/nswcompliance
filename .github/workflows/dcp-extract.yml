name: DCP Chapter Extraction

on:
  # Auto-trigger after monitor detects changes — always runs in REVIEW mode.
  # Generates a review artifact for human inspection. No DB writes.
  # To commit reviewed provisions to production, use dcp-commit.yml manually.
  workflow_run:
    workflows: ["DCP Chapter Monitor"]
    types: [completed]

  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (extract but no DB writes)'
        required: false
        type: boolean
        default: false

jobs:
  extract:
    name: Extract changed DCP chapters (review mode)
    runs-on: ubuntu-latest
    # Only run after a clean monitor completion — not after monitor errors
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-extract.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-extract.txt

      - name: Build extraction arguments
        id: args
        run: |
          ARGS="--review"
          if [ -n "${{ github.event.inputs.council }}" ]; then
            ARGS="$ARGS --council ${{ github.event.inputs.council }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run DCP extraction (review mode — no DB writes)
        id: extract
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python scripts/dcp_extract_changed.py ${{ steps.args.outputs.args }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload review file as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcp-review-${{ github.run_id }}
          path: reviews/
          if-no-files-found: ignore
          retention-days: 14

      - name: Report outcome
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CODE=${{ steps.extract.outputs.exit_code }}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$CODE" = "0" ]; then
            echo "Nothing to extract — no chapters with needs_extraction=TRUE."
          elif [ "$CODE" = "2" ]; then
            echo "Review file generated. Download from artifacts and inspect before committing."
            echo "To commit: Actions -> DCP Commit Reviewed Provisions -> Run workflow"
            # Telegram: notify with artifact link
            python - <<'PYEOF'
import os, requests
token = os.environ.get("TELEGRAM_BOT_TOKEN")
chat_id = os.environ.get("TELEGRAM_CHAT_ID")
run_url = os.environ.get("RUN_URL", "")
if token and chat_id:
    requests.post(
        f"https://api.telegram.org/bot{token}/sendMessage",
        json={"chat_id": chat_id, "text": (
            f"DCP Review ready\n"
            f"Download review file, inspect provisions, then run:\n"
            f"Actions -> DCP Commit Reviewed Provisions\n\n"
            f"Artifact: {run_url}"
        )},
        timeout=10,
    )
PYEOF
          else
            echo "Extraction failed with exit code $CODE."
            exit 1
          fi
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
