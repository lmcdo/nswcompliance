name: DCP Chapter Extraction

on:
  # Auto-trigger after monitor completes — always runs in REVIEW mode.
  # The monitor uses a matrix strategy (one job per council), so this
  # triggers once the overall workflow completes (not per-matrix-job).
  # Generates a review artifact for human inspection. No DB writes.
  # To commit reviewed provisions to production, use dcp-commit.yml manually.
  workflow_run:
    workflows: ["DCP Chapter Monitor"]
    types: [completed]

  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (extract but no DB writes) — pass "true" or "false"'
        required: false
        default: 'false'

jobs:
  extract:
    name: Extract changed DCP chapters (review mode)
    runs-on: ubuntu-latest
    # Only run after a clean monitor completion — not after monitor errors
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-extract.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-extract.txt

      - name: Build extraction arguments
        id: args
        run: |
          ARGS="--review"
          if [ -n "${{ github.event.inputs.council }}" ]; then
            ARGS="$ARGS --council ${{ github.event.inputs.council }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run DCP extraction (review mode — no DB writes)
        id: extract
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python scripts/dcp_extract_changed.py ${{ steps.args.outputs.args }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload review file as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcp-review-${{ github.run_id }}
          path: reviews/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run quality gate
        id: gate
        if: steps.extract.outputs.exit_code == '2'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          COUNCIL="${{ github.event.inputs.council }}"
          if [ -n "$COUNCIL" ]; then
            python scripts/dcp_quality_report.py --gate --council "$COUNCIL"
          else
            python scripts/dcp_quality_report.py --gate
          fi
          echo "gate_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Auto-commit if quality gate passes
        if: steps.extract.outputs.exit_code == '2' && steps.gate.outputs.gate_code == '0' && github.event.inputs.council != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Quality gate PASSED — auto-triggering commit workflow for ${{ github.event.inputs.council }}"
          gh workflow run dcp-commit.yml \
            -f council="${{ github.event.inputs.council }}" \
            -f confirmed="CONFIRM"

      - name: Report outcome
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CODE=${{ steps.extract.outputs.exit_code }}
          GATE=${{ steps.gate.outputs.gate_code || 'skip' }}
          COUNCIL="${{ github.event.inputs.council }}"

          if [ "$CODE" = "0" ]; then
            echo "Nothing to extract — no chapters with needs_extraction=TRUE."
          elif [ "$CODE" = "2" ]; then
            if [ "$GATE" = "0" ] && [ -n "$COUNCIL" ]; then
              echo "Quality gate PASSED — auto-committed $COUNCIL."
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                MSG="DCP auto-committed [$COUNCIL]\n\nQuality gate passed. Provisions committed to production.\n\nReview: ${RUN_URL}"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -H "Content-Type: application/json" \
                  -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MSG}\",\"disable_web_page_preview\":true}"
              fi
            else
              REASON=""
              if [ "$GATE" != "0" ] && [ "$GATE" != "skip" ]; then
                REASON=" (quality gate failed)"
              elif [ -z "$COUNCIL" ]; then
                REASON=" (no council specified — multi-council runs require manual review)"
              fi
              echo "Manual review required${REASON}."
              if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
                COMMIT_URL="https://github.com/${{ github.repository }}/actions/workflows/dcp-commit.yml"
                MSG="DCP Review required${REASON}\n\n1. Download review: ${RUN_URL}\n2. Inspect provisions\n3. Commit: ${COMMIT_URL}\n\n(Select council, type CONFIRM)"
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -H "Content-Type: application/json" \
                  -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MSG}\",\"disable_web_page_preview\":true}"
              fi
            fi
          else
            echo "Extraction failed with exit code $CODE."
            exit 1
          fi
