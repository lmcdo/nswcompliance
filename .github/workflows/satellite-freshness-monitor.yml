name: Satellite Data Source Freshness Monitor

on:
  schedule:
    # Daily 06:00 UTC (16:00 AEST) — after business hours, before nightly maintenance
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: 'Check a single source by key (leave blank for all)'
        required: false
        default: ''

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Run satellite freshness monitor
        id: monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set +e
          ARGS="--verbose"
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi
          python scripts/satellite_freshness_monitor.py $ARGS
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report outcome
        run: |
          CODE=${{ steps.monitor.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "All satellite data sources healthy."
          elif [ "$CODE" = "2" ]; then
            echo "One or more data sources degraded or down. Check Telegram for alert."
          else
            echo "Monitor script failed with exit code $CODE."
            exit 1
          fi
