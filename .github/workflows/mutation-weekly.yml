name: Mutation Testing (Weekly Health Check)

# Full mutmut run across all 3 service files.
# Creates/updates a GitHub issue with the summary.
# This is the "are our tests decaying?" early warning system.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC (4pm AEST)
  workflow_dispatch:  # Manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  full-mutation:
    name: Full Mutation Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: flood_truth
            file: services/flood_truth.py
            tests: tests/test_flood_truth.py
          - name: threat_radar
            file: services/threat_radar.py
            tests: tests/test_threat_radar_mutation.py
          - name: granny_flat
            file: services/granny_flat.py
            tests: tests/test_granny_flat_mutation.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt icontract
          pip install mutmut

      - name: Check files exist
        id: check
        run: |
          if [ -f "${{ matrix.service.file }}" ] && [ -f "${{ matrix.service.tests }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.service.name }} — file(s) not found"
          fi

      - name: Run mutmut
        if: steps.check.outputs.exists == 'true'
        id: mutmut
        run: |
          rm -rf .mutmut-cache html/

          python -m mutmut run \
            --paths-to-mutate="${{ matrix.service.file }}" \
            --tests-dir=tests/ \
            --runner="python -m pytest ${{ matrix.service.tests }} -x -q --no-header --tb=no" \
            --no-progress 2>&1 || true

          # Parse results
          python3 -c "
          import sqlite3, json, os
          try:
              conn = sqlite3.connect('.mutmut-cache')
              c = conn.cursor()
              c.execute('SELECT status, count(*) FROM Mutant GROUP BY status')
              r = dict(c.fetchall())
              t = sum(r.values())
              k = r.get('ok_killed', 0)
              s = r.get('bad_survived', 0)
              to = r.get('bad_timeout', 0)
              pct = round(k/t*100, 1) if t else 0
              conn.close()
          except Exception:
              t = k = s = to = 0
              pct = 0

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'total={t}\n')
              f.write(f'killed={k}\n')
              f.write(f'survived={s}\n')
              f.write(f'timeout={to}\n')
              f.write(f'pct={pct}\n')
          "

      - name: Upload results artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-${{ matrix.service.name }}
          path: .mutmut-cache
          retention-days: 7

      - name: Write result file
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p /tmp/mutation-results
          echo '${{ matrix.service.name }}|${{ steps.mutmut.outputs.killed }}|${{ steps.mutmut.outputs.total }}|${{ steps.mutmut.outputs.survived }}|${{ steps.mutmut.outputs.pct }}' > /tmp/mutation-results/${{ matrix.service.name }}.txt

      - name: Upload result summary
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-result-${{ matrix.service.name }}
          path: /tmp/mutation-results/${{ matrix.service.name }}.txt
          retention-days: 1

  report:
    name: Create Issue Report
    needs: full-mutation
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-result-*
          path: /tmp/results
          merge-multiple: true

      - name: Build report and create/update issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsDir = '/tmp/results';
            let rows = [];
            let overallKilled = 0;
            let overallTotal = 0;
            let anyBelow65 = false;

            if (fs.existsSync(resultsDir)) {
              const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.txt'));
              for (const file of files) {
                const content = fs.readFileSync(path.join(resultsDir, file), 'utf8').trim();
                const [name, killed, total, survived, pct] = content.split('|');
                overallKilled += parseInt(killed) || 0;
                overallTotal += parseInt(total) || 0;

                const pctNum = parseFloat(pct) || 0;
                const emoji = pctNum >= 70 ? '🟢' : pctNum >= 50 ? '🟡' : '🔴';
                if (pctNum < 65) anyBelow65 = true;

                rows.push(`| ${name} | ${killed}/${total} (${pct}%) | ${survived} | ${emoji} |`);
              }
            }

            if (rows.length === 0) {
              rows.push('| _No results_ | - | - | - |');
            }

            const overallPct = overallTotal > 0
              ? (overallKilled / overallTotal * 100).toFixed(1)
              : '0';

            const date = new Date().toISOString().split('T')[0];
            const overallEmoji = parseFloat(overallPct) >= 70 ? '🟢' : parseFloat(overallPct) >= 50 ? '🟡' : '🔴';

            const title = `Mutation Testing Health Check — ${date}`;
            const body = `## ${overallEmoji} Weekly Mutation Testing Report

            **Date:** ${date}
            **Overall kill rate:** ${overallKilled}/${overallTotal} (${overallPct}%)
            **Target:** >65% (warning), >70% (healthy)

            | Service | Kill Rate | Survivors | Status |
            |---------|-----------|-----------|--------|
            ${rows.join('\n')}

            ### What to do

            ${anyBelow65
              ? '⚠️ **One or more services below 65% kill rate.** Surviving mutants indicate test gaps where code changes would not be caught. Review the mutation cache artifacts for specific surviving mutants.'
              : '✅ All services above threshold. No action needed.'}

            ### How to investigate survivors

            \`\`\`bash
            # Download the artifact for a specific service, then:
            python -m mutmut results  # shows surviving mutants
            python -m mutmut show <id>  # shows the specific mutation
            \`\`\`

            _Auto-generated by mutation-weekly.yml_`;

            // Find existing open issue with this label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'mutation-health',
              state: 'open',
            });

            if (issues.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title: title,
                body: body,
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['mutation-health'],
              });
              console.log('Created new mutation health issue');
            }
