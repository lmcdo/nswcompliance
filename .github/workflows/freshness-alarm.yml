# ONE alarm, on the outcome, from outside the thing it watches.
#
# WHY THIS AND NOT NINE HEARTBEATS
# --------------------------------
# run_monitors.py can give every Railway stage its own healthchecks.io URL. Measured on
# the live fleet 2026-09-28, that arrangement was misconfigured NINE TIMES OUT OF NINE:
# six services shared the literal string `https://hc-ping.com/placeholder-satellite`,
# which is not a check, and three had no URL at all. Nine config points, one operator.
#
# And a per-stage heartbeat answers the wrong question. It says a process started. It
# cannot say the process did anything: `dcp-monitor` can sweep, be refused by every
# council's WAF, skip all of them and exit 0 — ping sent, check green, nothing checked.
#
# This asks the only question that matters to a reader of a property report: IS WHAT WE
# SERVE STILL CURRENT? That is already executable — `scripts/dq_check.py` is the ledger
# (memory/project-dq-ledger-executable-2026-08.md) and DQ-117/DQ-70 are exactly this
# question. One check, pinged only when the ledger is green, covers both failures at
# once:
#
#   the data goes stale        -> ledger red -> no ping -> healthchecks.io alerts
#   this workflow stops        -> no ping            -> healthchecks.io alerts
#
# It cannot read green while the served data is stale, because what it reports on IS the
# served data. That is the property nine liveness pings never had.
#
# WHY GITHUB ACTIONS
# ------------------
# §5.2 invariant 8 and §7 of docs/DCP_PIPELINE_ARCHITECTURE_2026-06.md both require the
# watchdog to be EXTERNAL: "an alarm that lives inside the thing it watches cannot report
# that thing's silence." Railway runs the pipeline, so the alarm must not. Actions is
# already used here (gates.yml, main-red-alarm.yml) and already holds DATABASE_URL, so
# this adds no vendor and no new secret store.
#
# GitHub disables scheduled workflows in a repository with no commits for 60 days. That
# is precisely what the healthchecks.io side catches: no workflow, no ping, alarm.
name: freshness-alarm

on:
  schedule:
    # 19:30 UTC daily = 05:30-06:30 Sydney. After the 03:00 UTC extract and the 09:00
    # UTC commit, so a red row reflects the day's runs rather than pre-empting them.
    - cron: "30 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: freshness-alarm
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the little this needs
        run: pip install --quiet psycopg2-binary python-dotenv requests

      - name: Is the served data still current?
        id: ledger
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set, so this alarm cannot read"
            echo "anything. An alarm that cannot run must fail loudly, never skip."
            echo "rc=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The freshness rows specifically. DQ-117 = did the source sweep run.
          # DQ-70 = does what we serve still match its source. Both are DB-backed and
          # neither can be satisfied by editing code.
          set +e
          : > ledger.txt
          rc=0
          for id in DQ-117 DQ-70; do
            echo "--- $id" | tee -a ledger.txt
            python scripts/dq_check.py --id "$id" 2>&1 | tee -a ledger.txt
            c=${PIPESTATUS[0]}
            # 1 = looked and found red; anything else non-zero (2, a crash, a kill) = did not look.
            if [ "$c" -eq 1 ]; then [ "$rc" -lt 1 ] && rc=1; elif [ "$c" -ne 0 ]; then rc=2; fi
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # Is every served DCP chapter watched and checked? Per council and per chapter, against
      # a baseline that may only shrink (scripts/verifyops_coverage.py, DQ-118). Run directly,
      # not through dq_check: DQ-118 is declared open, and an open row that fails exits 0
      # there, which would make this step unable to go red. Exit 2 = could not look.
      - name: Is every served DCP chapter watched and checked?
        id: coverage
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python scripts/verifyops_coverage.py 2>&1 | tee coverage.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Did every scheduled Railway job run, and did its last run succeed? Checked from
      # here, outside Railway, because a job that crashes on import or never starts
      # cannot alert from inside itself: dcp-extract and dcp-commit crashed on every run
      # for days in October 2026 and nothing said so. Red here = no ping below.
      - name: Did every Railway job run and succeed?
        id: railway
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          python scripts/check_railway_jobs_ran.py 2>&1 | tee railway.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Did the nightly live-data job (data-watch) succeed in the last 48 h? Moved here from the PR gate
      # 2026-10-25: a scheduled job that stops cannot report itself, so the outside alarm asks instead of every PR.
      - name: Did the nightly live-data checks run?
        id: datawatch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check_data_watch_freshness.py 2>&1 | tee datawatch.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # v7 step 4: the outside watchdog hears whether we LOOKED, and red goes to Telegram.
      # looked (every rc 0/1) AND any red delivered (Telegram ok + message_id) -> ping;
      # could not look (2), a crashed step (no rc) or Telegram failing -> ping /fail;
      # runner or GitHub dead -> no ping, healthchecks.io emails after its grace period.
      # Old rule (ping only when all green) emailed every 2 days for a known, baselined red.
      - name: Tell the outside watchdog, and send red to Telegram
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_FRESHNESS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python scripts/verifyops_outside_ping.py
          --rc "ledger=${{ steps.ledger.outputs.rc }}"
          --rc "coverage=${{ steps.coverage.outputs.rc }}"
          --rc "railway=${{ steps.railway.outputs.rc }}"
          --rc "datawatch=${{ steps.datawatch.outputs.rc }}"
          --report ledger.txt --report coverage.txt --report railway.txt --report datawatch.txt
