name: Python Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Unit Tests + Hypothesis + Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r requirements-test.txt icontract

      - name: Run unit tests (includes hypothesis property tests + contract tests)
        run: python -m pytest tests/ --tb=short -v

      - name: Verify test count baselines (ratchet)
        run: |
          if [ -f mutation-baselines.json ] && [ -f scripts/check_test_baselines.py ]; then
            python scripts/check_test_baselines.py mutation-baselines.json
          else
            echo "No mutation baselines configured — skipping ratchet check."
          fi

  qa-gate:
    name: QA Report Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history: qa_gate.py matches the report hash against the last
          # 5 branch commits; a depth-1 checkout only sees the merge ref.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate QA report
        run: |
          if [ -f .qa_report.json ]; then
            python scripts/qa_gate.py .qa_report.json
          else
            echo "WARNING: No .qa_report.json found"
            echo "Non-trivial PRs require a QA report."
          fi

  liability-language:
    name: Liability Language Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan new code for liability language
        run: python scripts/liability_language_check.py --diff-base origin/main
