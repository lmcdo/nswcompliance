name: DCP Chapter Monitor

on:
  schedule:
    # Every Monday at 02:00 UTC (midday AEST / midnight AEDT)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no DB writes or R2 uploads)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force re-download all chapters regardless of Content-Length'
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    name: Check DCP chapters for changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Build monitor arguments
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.council }}" ]; then
            ARGS="$ARGS --council ${{ github.event.inputs.council }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run DCP monitor
        id: monitor
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/r2_monitor.py ${{ steps.args.outputs.args }}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        # Exit code 2 = changes detected — not a failure, just informational
        continue-on-error: true

      - name: Report outcome
        run: |
          CODE=${{ steps.monitor.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "✅ No changes detected. All chapters are current."
          elif [ "$CODE" = "2" ]; then
            echo "📋 Changes detected. Chapters flagged with needs_extraction=TRUE in dcp_chapter_registry."
            echo "Next step: run the extraction pipeline on changed chapters."
          else
            echo "❌ Monitor failed with exit code $CODE."
            exit 1
          fi
