name: DCP Chapter Monitor

on:
  # Schedule disabled — moved to Railway cron (see docs/RAILWAY_MONITORS.md)
  # schedule:
  #   - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      council:
        description: 'Filter to specific council (leave blank for all — matrix runs all councils)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no DB writes or R2 uploads) — pass "true" or "false"'
        required: false
        default: 'false'
      force:
        description: 'Force re-download all chapters regardless of Content-Length — pass "true" or "false"'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # When a specific council is provided, run a single job for that council.
  # Otherwise, run a matrix of jobs — one per council group.
  # This avoids CDN rate-limiting from 188 sequential downloads on one runner IP.
  monitor-single:
    name: "Check DCP chapters (${{ github.event.inputs.council }})"
    if: ${{ github.event.inputs.council != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Run DCP monitor
        id: monitor
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          ARGS="--council ${{ github.event.inputs.council }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/r2_monitor.py $ARGS
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report outcome
        run: |
          CODE=${{ steps.monitor.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "No changes detected."
          elif [ "$CODE" = "2" ]; then
            echo "Changes detected. Chapters flagged with needs_extraction=TRUE."
          else
            echo "Monitor failed with exit code $CODE."
            exit 1
          fi

  monitor-matrix:
    name: "Check DCP chapters (${{ matrix.council }})"
    if: ${{ github.event.inputs.council == '' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Inner West councils grouped together (share same CDN).
        # Expansion councils run as separate jobs for isolation.
        council:
          - marrickville
          - leichhardt
          - ashfield
          - city_of_sydney
          - ku_ring_gai
          - woollahra
          - waverley
          - blacktown
          - campbelltown
          - canterbury_bankstown
          - cumberland
          - hornsby
          - liverpool
          - northern_beaches
          - parramatta
          - penrith
          - bayside
          - georges_river
          - randwick
          - sutherland_shire
          - burwood
          - camden
          - canada_bay
          - fairfield
          - ryde
          - strathfield
          - the_hills
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Run DCP monitor
        id: monitor
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          ARGS="--council ${{ matrix.council }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python scripts/r2_monitor.py $ARGS
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Report outcome
        run: |
          CODE=${{ steps.monitor.outputs.exit_code }}
          if [ "$CODE" = "0" ]; then
            echo "[${{ matrix.council }}] No changes detected."
          elif [ "$CODE" = "2" ]; then
            echo "[${{ matrix.council }}] Changes detected."
          else
            echo "[${{ matrix.council }}] Failed with exit code $CODE."
            exit 1
          fi

  # Dead man's switch — pings healthchecks.io on success.
  # If this workflow stops running (cron disabled, Actions outage, etc.)
  # healthchecks.io will alert via its own channel after the grace period.
  heartbeat:
    needs: [monitor-single, monitor-matrix]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthcheck
        run: |
          if [ -z "${{ secrets.HC_PING_DCP_MONITOR }}" ]; then
            echo "::error::HC_PING_DCP_MONITOR secret not set — dead man's switch is not active"
            exit 1
          fi
          curl -fsS --retry 3 "${{ secrets.HC_PING_DCP_MONITOR }}"

  notify-on-failure:
    needs: [monitor-single, monitor-matrix]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: ${{ github.workflow }}
      extra_context: "One or more council monitors failed — check run for details"
    secrets: inherit
