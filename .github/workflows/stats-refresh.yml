name: Refresh Secondary Dwelling Stats

on:
  schedule:
    # Every Sunday 20:00 UTC (Monday 06:00 AEST)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-stats.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-stats.txt

      - name: Fetch stats from Planning Portal
        env:
          DA_SUPABASE_URL: ${{ secrets.DA_SUPABASE_URL }}
          DA_SUPABASE_ANON_KEY: ${{ secrets.DA_SUPABASE_ANON_KEY }}
        run: |
          python scripts/secondary_dwelling_stats.py --output json > /tmp/stats.json
          echo "Council count: $(python -c "import json; d=json.load(open('/tmp/stats.json')); print(len(d['councils']))")"

      - name: Convert JSON to TypeScript
        run: |
          python scripts/json_to_ts_stats.py \
            --input /tmp/stats.json \
            --output frontend-nextjs/lib/lga-data/secondary-dwelling-stats.ts

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet frontend-nextjs/lib/lga-data/secondary-dwelling-stats.ts && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend-nextjs/lib/lga-data/secondary-dwelling-stats.ts
          git commit -m "chore: refresh secondary dwelling stats ($(date -u +%Y-%m-%d))"
          git push
