name: Legislation Monitor

on:
  # Railway cron blocked by Cloudflare (403 on all legislation.nsw.gov.au pages).
  # Re-enabled here — GitHub Actions IPs are not blocked.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-monitor.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run legislation monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/legislation_monitor.py

  heartbeat:
    needs: [check-instruments]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthcheck
        run: |
          if [ -z "${{ secrets.HC_PING_LEGISLATION_MONITOR }}" ]; then
            echo "::error::HC_PING_LEGISLATION_MONITOR secret not set — dead man's switch is not active"
            exit 1
          fi
          curl -fsS --retry 3 "${{ secrets.HC_PING_LEGISLATION_MONITOR }}"

  notify-on-failure:
    needs: [check-instruments]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: ${{ github.workflow }}
    secrets: inherit
