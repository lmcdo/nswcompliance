name: Legislation Monitor

on:
  schedule:
    # Every Monday 08:00 UTC (offset from DCP monitor at 07:00)
    # Polls AustLII consolidated copies — ~7-day lag vs legislation.nsw.gov.au
    # Replace with legislation.nsw.gov.au XML export once PCO API access granted
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  check-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Run legislation monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/legislation_monitor.py
