name: Mutation Testing (PR)

# Non-blocking: posts kill rate as PR comment. Does NOT block merge.
# Runs only when services/*.py files are changed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/*.py'
      - 'tests/test_flood_truth.py'
      - 'tests/test_threat_radar_mutation.py'
      - 'tests/test_granny_flat_mutation.py'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutate:
    name: Mutation Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt icontract
          pip install mutmut

      - name: Detect changed service files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'services/*.py' | grep -v '__pycache__' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutmut on changed services
        if: steps.changed.outputs.skip == 'false'
        id: mutmut
        run: |
          REPORT=""
          OVERALL_KILLED=0
          OVERALL_TOTAL=0

          while IFS= read -r svc; do
            [ -z "$svc" ] && continue
            base=$(basename "$svc" .py)

            # Find matching test file(s)
            test_file=""
            for candidate in "tests/test_${base}.py" "tests/test_${base}_mutation.py" "tests/test_${base}_logic.py"; do
              if [ -f "$candidate" ]; then
                test_file="$candidate"
                break
              fi
            done

            if [ -z "$test_file" ]; then
              REPORT="${REPORT}| \`${svc}\` | - | - | No test file found |\n"
              continue
            fi

            echo "::group::Mutating $svc"

            # Clean previous run
            rm -rf .mutmut-cache html/

            # Run mutmut (v3 syntax)
            python -m mutmut run \
              --paths-to-mutate="$svc" \
              --tests-dir=tests/ \
              --runner="python -m pytest $test_file -x -q --no-header --tb=no" \
              --no-progress 2>&1 || true

            # Parse results from cache
            STATS=$(python3 -c "
          import sqlite3, json
          try:
              conn = sqlite3.connect('.mutmut-cache')
              c = conn.cursor()
              c.execute('SELECT status, count(*) FROM Mutant GROUP BY status')
              r = dict(c.fetchall())
              t = sum(r.values())
              k = r.get('ok_killed', 0)
              s = r.get('bad_survived', 0)
              to = r.get('bad_timeout', 0)
              pct = k/t*100 if t else 0
              print(json.dumps({'total': t, 'killed': k, 'survived': s, 'timeout': to, 'pct': round(pct, 1)}))
              conn.close()
          except Exception as e:
              print(json.dumps({'total': 0, 'killed': 0, 'survived': 0, 'timeout': 0, 'pct': 0, 'error': str(e)}))
          ")

            KILLED=$(echo "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin)['killed'])")
            TOTAL=$(echo "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin)['total'])")
            SURVIVED=$(echo "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin)['survived'])")
            PCT=$(echo "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin)['pct'])")

            OVERALL_KILLED=$((OVERALL_KILLED + KILLED))
            OVERALL_TOTAL=$((OVERALL_TOTAL + TOTAL))

            # Emoji based on kill rate
            if [ "$(echo "$PCT >= 70" | bc)" = "1" ]; then
              BADGE="pass"
            elif [ "$(echo "$PCT >= 50" | bc)" = "1" ]; then
              BADGE="warn"
            else
              BADGE="fail"
            fi

            REPORT="${REPORT}| \`${svc}\` | ${KILLED}/${TOTAL} (${PCT}%) | ${SURVIVED} survived | ${BADGE} |\n"

            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.files }}"

          # Overall stats
          if [ "$OVERALL_TOTAL" -gt 0 ]; then
            OVERALL_PCT=$(python3 -c "print(round($OVERALL_KILLED/$OVERALL_TOTAL*100, 1))")
          else
            OVERALL_PCT="0"
          fi

          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "overall_pct=$OVERALL_PCT" >> "$GITHUB_OUTPUT"
          echo "overall_killed=$OVERALL_KILLED" >> "$GITHUB_OUTPUT"
          echo "overall_total=$OVERALL_TOTAL" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.changed.outputs.skip == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const report = `${{ steps.mutmut.outputs.report }}`;
            const pct = `${{ steps.mutmut.outputs.overall_pct }}`;
            const killed = `${{ steps.mutmut.outputs.overall_killed }}`;
            const total = `${{ steps.mutmut.outputs.overall_total }}`;

            const emoji = parseFloat(pct) >= 70 ? '🟢' : parseFloat(pct) >= 50 ? '🟡' : '🔴';

            const body = `## ${emoji} Mutation Testing Report

            **Overall kill rate: ${killed}/${total} (${pct}%)**
            Target: >70%

            | Service | Kill Rate | Survivors | Status |
            |---------|-----------|-----------|--------|
            ${report}

            <details>
            <summary>What does this mean?</summary>

            Mutation testing introduces small changes (mutants) to your code and checks if tests catch them.
            - **Killed**: test suite detected the mutation (good)
            - **Survived**: mutation was NOT detected — potential test gap
            - **>70%**: strong test suite | **50-70%**: adequate | **<50%**: tests may be superficial
            </details>

            _This check is informational and does not block merge._`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Mutation Testing Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
