name: Validate Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-nextjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Test production build
        run: npm run build
        env:
          # Mock env vars for build (not actual secrets)
          PGHOST: localhost
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: test
          PGPORT: 5432
          NODE_ENV: production

      - name: Check for untracked critical files
        working-directory: .
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard | grep -E '^frontend-nextjs/(app|lib|components)/' || true)
          if [ ! -z "$UNTRACKED" ]; then
            echo "⚠️ Warning: Found untracked files in critical directories:"
            echo "$UNTRACKED"
            echo "These files won't be deployed. Consider adding them to git."
          fi

  # Only allow merge if validation passes
  block-on-failure:
    name: Block Merge on Failure
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Check validation result
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "❌ Validation failed. Cannot merge."
            exit 1
          fi
          echo "✅ All checks passed"
