# One-off test on a throwaway branch (never merged): which fetch method gets past blocked council firewalls.
name: probe-blocked-councils
on:
  push:
    branches: [chore/probe-blocked-councils]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests curl_cffi playwright && python -m playwright install --with-deps chromium
      - run: python probe/probe_pdfs.py
