name: DCP Watchdog

# Daily check for stuck extractions — catches cases where the monitor fired
# but the workflow_run chain broke and needs_extraction=TRUE rows aged without
# being processed.

on:
  schedule:
    # Daily at 10:00 UTC — well after the Monday 02:00 UTC monitor run
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  watchdog:
    name: Check for stuck or unprocessed extractions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-monitor.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-monitor.txt

      - name: Check for stuck chapters
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/dcp_watchdog.py

  notify-on-failure:
    needs: [watchdog]
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: ${{ github.workflow }}
    secrets: inherit
