# Railway config-as-code for the `property-alerts` cron service.
# Point the service's "Config Path" (Settings > Config as code) at this file.
# Still set per-service env in the dashboard:
#   MONITOR_NAME=property-alerts, DATABASE_URL, RESEND_API_KEY,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, (optional) HC_PING_URL,
#   (optional) ALERTS_FROM_EMAIL, ALERTS_UNSUBSCRIBE_BASE.
#
# Runs run_alerts_dispatch.py via run_monitors: for each active
# threat_radar subscription, checks the NSW ePlanning feeds for new development
# applications near the address and emails the subscriber (Resend). Dedup state
# advances only after a confirmed send. Weekly cadence matches the daily-updated
# ePlanning feed without over-mailing subscribers.
#
# RESEND_API_KEY is NOT on the monitors service by default (it lives in Vercel
# env for the frontend) — it MUST be added to this Railway service, and the
# `from:` sending domain (plotdetect.com.au) must be verified in Resend.
[build]
# Rebuild when anything this image COPYs changes. Railway's dashboard list was hand-picked and
# missed council_quote.py, so the #1582 fix never deployed. Kept equal to the COPY lines by
# tests/test_dockerfile_monitors_imports.py::test_every_monitors_service_watches_what_the_image_copies
watchPatterns = [
    "Dockerfile.monitors",
    "railway.alerts.toml",
    "scripts/requirements-monitor.txt",
    "scripts/satellite_freshness_monitor.py",
    "scripts/legislation_monitor.py",
    "scripts/pco_client.py",
    "scripts/regulatory_freshness_monitor.py",
    "scripts/r2_monitor.py",
    "scripts/verifyops_record.py",
    "scripts/verifyops_links.py",
    "scripts/verifyops_classify.py",
    "scripts/extract_dcp_stated_dates.py",
    "scripts/pdf_text_hash.py",
    "scripts/dcp_watchdog.py",
    "scripts/hub_scrapers/**",
    "scripts/run_monitors.py",
    "scripts/probe_blocked_councils.py",
    "scripts/dcp_extract_changed.py",
    "scripts/dcp_commit_approved.py",
    "scripts/pipeline_run.py",
    "scripts/council_quote.py",
    "scripts/council_quote_db.py",
    "scripts/council_quote_table.py",
    "scripts/council_quote_picture.py",
    "scripts/derive_precinct_keys.py",
    "scripts/never_serve.py",
    "scripts/gate_rules.py",
    "scripts/gate_rules_roads.py",
    "scripts/gate_rules_areas.py",
    "scripts/dcp_area_link_guard.py",
    "data/cos_precinct_page_ranges.json",
    "scripts/verify_dcp_formatting.py",
    "scripts/dcp_quality_report.py",
    "scripts/ai_extractor.py",
    "scripts/dcp_page_map_gate.py",
    "scripts/dcp_toc_parse.py",
    "scripts/dcp_fidelity_gate.py",
    "scripts/verify_extraction_fidelity.py",
    "scripts/citation_proof.py",
    "scripts/pdf_picture_labels.py",
    "scripts/page_coverage.py",
    "scripts/dcp_citation_status.py",
    "scripts/dcp_setback_citation_status.py",
    "scripts/dq_probe_section_code_not_in_source.py",
    "scripts/dcp_page_repair.py",
    "scripts/rule_page_locator.py",
    "scripts/dq_probe_live.py",
    "data/chapter_scope/**",
    "scripts/dq_db.py",
    "scripts/qa_report_path.py",
    "scripts/outreach_claim_checks.py",
    "scripts/conveyancing_db.py",
    "scripts/outreach_flood_depth_probe.py",
    "scripts/outreach_scoped_councils.py",
    "scripts/dq_probe_applicability_config.py",
    "services/extracted_data_integrity.py",
    "scripts/dcp_section_code.py",
    "scripts/dcp_supersede_guard.py",
    "scripts/dcp_chapter_measure.py",
