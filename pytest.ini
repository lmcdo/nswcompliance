[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not stale and not database and not integration"
markers =
    integration: marks tests as integration tests (require DB connection)
    unit: marks tests as unit tests
    stale: marks tests as stale/broken (need DB or outdated schema — run with -m stale)
    database: marks tests that require DATABASE_URL (deselected by default)
    integration: marks tests that drive a running local server (deselected by
        default; run with `pytest -m integration` once the dev server is up).
        Deselected rather than left to skip on purpose: a conditional skip
        inflates the skip count, and the dependency-skip ratchet exists to keep
        that number small and meaningful. A test that cannot run here is not a
        skipped test, it is a test for a different environment.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
