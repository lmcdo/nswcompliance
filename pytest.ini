[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not stale and not database"
markers =
    integration: marks tests as integration tests (require DB connection)
    unit: marks tests as unit tests
    stale: marks tests as stale/broken (need DB or outdated schema — run with -m stale)
    database: marks tests that require DATABASE_URL (deselected by default)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
