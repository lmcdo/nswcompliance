<!DOCTYPE html>
<html>
<head>
    <title>Simple Google Places Test</title>
</head>
<body>
    <h1>Google Places Test</h1>
    <input id="address" type="text" placeholder="Type address" style="width: 400px; padding: 10px;">
    <div id="status" style="margin-top: 20px; padding: 10px; background: #f0f0f0;"></div>
    
    <script>
        const status = document.getElementById('status');
        
        function updateStatus(msg) {
            console.log(msg);
            status.innerHTML += msg + '<br>';
        }
        
        updateStatus('Loading Google Maps API...');
        
        const script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyCi5UBAg6X-k6W8v1vv9XEQaML9aQE-w60&libraries=places';
        
        script.onload = function() {
            updateStatus('Script loaded, checking API...');
            
            setTimeout(() => {
                if (window.google && window.google.maps && window.google.maps.places) {
                    updateStatus('✓ Google Maps API ready!');
                    
                    const input = document.getElementById('address');
                    const autocomplete = new google.maps.places.Autocomplete(input, {
                        types: ['address'],
                        componentRestrictions: { country: 'au' }
                    });
                    
                    autocomplete.addListener('place_changed', () => {
                        const place = autocomplete.getPlace();
                        updateStatus('Selected: ' + place.formatted_address);
                    });
                    
                    updateStatus('✓ Autocomplete ready - try typing!');
                } else {
                    updateStatus('✗ Google Maps API not available');
                }
            }, 1000);
        };
        
        script.onerror = function() {
            updateStatus('✗ Failed to load Google Maps script');
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
