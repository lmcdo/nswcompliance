<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { margin: 10px 5px; padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>NSW Planning Engine - Frontend Test</h1>
    <div id="test-results"></div>
    
    <h2>Manual Tests</h2>
    <button onclick="testAPIConnection()">Test API Connection</button>
    <button onclick="testModuleLoading()">Test Module Loading</button>
    <button onclick="testTabSwitching()">Test Tab Switching</button>
    <button onclick="testModalFunctions()">Test Modal Functions</button>
    
    <script type="module">
        import { API_CONFIG } from './js/config/api-config.js';
        import { checkConnection } from './js/services/api-service.js';
        import { switchTab } from './js/components/tab-manager.js';
        import { openModal, closeModal } from './js/components/modal-manager.js';

        window.testResults = [];
        
        function addResult(test, status, message) {
            const result = { test, status, message, timestamp: new Date().toISOString() };
            window.testResults.push(result);
            
            const resultsDiv = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message} (${status.toUpperCase()})`;
            resultsDiv.appendChild(div);
        }
        
        // Test API Configuration Loading
        try {
            if (API_CONFIG && API_CONFIG.baseURL && API_CONFIG.endpoints) {
                addResult('API Config', 'success', `Loaded successfully. BaseURL: ${API_CONFIG.baseURL}`);
            } else {
                addResult('API Config', 'error', 'Failed to load API configuration');
            }
        } catch (error) {
            addResult('API Config', 'error', `Error loading: ${error.message}`);
        }
        
        // Test Module Imports
        try {
            if (typeof checkConnection === 'function') {
                addResult('API Service Import', 'success', 'API service functions imported successfully');
            } else {
                addResult('API Service Import', 'error', 'Failed to import API service functions');
            }
        } catch (error) {
            addResult('API Service Import', 'error', `Import error: ${error.message}`);
        }
        
        try {
            if (typeof switchTab === 'function') {
                addResult('Tab Manager Import', 'success', 'Tab manager functions imported successfully');
            } else {
                addResult('Tab Manager Import', 'error', 'Failed to import tab manager functions');
            }
        } catch (error) {
            addResult('Tab Manager Import', 'error', `Import error: ${error.message}`);
        }
        
        try {
            if (typeof openModal === 'function' && typeof closeModal === 'function') {
                addResult('Modal Manager Import', 'success', 'Modal manager functions imported successfully');
            } else {
                addResult('Modal Manager Import', 'error', 'Failed to import modal manager functions');
            }
        } catch (error) {
            addResult('Modal Manager Import', 'error', `Import error: ${error.message}`);
        }
        
        // Make functions globally available for manual testing
        window.testAPIConnection = async function() {
            try {
                addResult('API Connection Test', 'info', 'Testing API connection...');
                await checkConnection();
                addResult('API Connection Test', 'success', 'API connection test completed');
            } catch (error) {
                addResult('API Connection Test', 'error', `API connection failed: ${error.message}`);
            }
        };
        
        window.testModuleLoading = function() {
            const modules = ['api-config.js', 'api-service.js', 'tab-manager.js', 'modal-manager.js', 'property-service.js'];
            let loadedCount = 0;
            
            modules.forEach(module => {
                try {
                    // This is a simplified test - in reality, modules are already loaded
                    loadedCount++;
                    addResult(`Module: ${module}`, 'success', 'Module structure appears correct');
                } catch (error) {
                    addResult(`Module: ${module}`, 'error', `Error: ${error.message}`);
                }
            });
            
            addResult('Module Loading Summary', 'info', `${loadedCount}/${modules.length} modules loaded`);
        };
        
        window.testTabSwitching = function() {
            try {
                // Create mock tab elements for testing
                const testContainer = document.createElement('div');
                testContainer.innerHTML = `
                    <div class="tab-content active" id="test-tab-1">Tab 1</div>
                    <div class="tab-content" id="test-tab-2">Tab 2</div>
                    <button onclick="switchTab('test-tab-2')">Switch to Tab 2</button>
                `;
                document.body.appendChild(testContainer);
                
                // Test tab switching
                switchTab('test-tab-2');
                addResult('Tab Switching', 'success', 'Tab switching function executed without errors');
                
                // Cleanup
                document.body.removeChild(testContainer);
            } catch (error) {
                addResult('Tab Switching', 'error', `Tab switching failed: ${error.message}`);
            }
        };
        
        window.testModalFunctions = function() {
            try {
                // Create mock modal for testing
                const modal = document.createElement('div');
                modal.id = 'imageModal';
                modal.className = 'modal';
                modal.innerHTML = '<img id="modalImage" class="modal-content">';
                document.body.appendChild(modal);
                
                // Test modal functions
                openModal('test-image.jpg');
                closeModal();
                addResult('Modal Functions', 'success', 'Modal functions executed without errors');
                
                // Cleanup
                document.body.removeChild(modal);
            } catch (error) {
                addResult('Modal Functions', 'error', `Modal functions failed: ${error.message}`);
            }
        };
        
        // Auto-run API connection test
        setTimeout(() => {
            window.testAPIConnection();
        }, 1000);
        
        addResult('Frontend Test', 'info', 'Modular frontend test page loaded successfully');
    </script>
</body>
</html>
