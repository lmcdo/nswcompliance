# Railway config-as-code for the `dcp-extract` cron service.
# Point the service's "Config Path" (Settings > Config as code) at this file.
# Still set per-service env in the dashboard:
#   MONITOR_NAME=dcp-extract, DATABASE_URL, R2_ACCOUNT_ID, R2_BUCKET_NAME,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   (optional) HC_PING_URL.
#
# Runs dcp_extract_changed.py --review: re-extracts changed chapters and enqueues
# the diff to dcp_review_queue for human approval. NO provision commit.
[build]
dockerfilePath = "Dockerfile.monitors"

[deploy]
startCommand = "python scripts/run_monitors.py"
cronSchedule = "0 3 * * *"   # DAILY 03:00 UTC (founder decision 2026-07-28): a
                             # weekly run left detected changes stuck up to 6
                             # days, tripping the watchdog's >48h alarm by
                             # design. Near-free when the queue is empty (the
                             # script exits in seconds with nothing flagged).
restartPolicyType = "NEVER"  # cron job: run to completion, do not restart
