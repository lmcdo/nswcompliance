<!DOCTYPE html>
<html>
<head>
    <title>Test Enhanced UI with Clause Citations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .front { background-color: #e3f2fd; border-color: #1976d2; }
        .rear { background-color: #e8f5e8; border-color: #388e3c; }
        .side { background-color: #f3e5f5; border-color: #7b1fa2; }
        .confidence-high { background-color: #c8e6c9; color: #2e7d32; }
        .confidence-medium { background-color: #fff3e0; color: #f57c00; }
        .confidence-low { background-color: #ffcdd2; color: #d32f2f; }
        .authority-badge { 
            display: inline-block; 
            padding: 4px 8px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: bold;
            margin-bottom: 8px;
        }
        .precedence-1 { background-color: #ffebee; color: #c62828; }
        .precedence-2 { background-color: #fff3e0; color: #ef6c00; }
        .precedence-3 { background-color: #e3f2fd; color: #1565c0; }
        .clause-citation { 
            background-color: #f5f5f5; 
            border-left: 4px solid #2196f3; 
            padding: 10px; 
            margin: 10px 0; 
            font-style: italic;
        }
        .explanation { background-color: #f9f9f9; padding: 10px; margin: 8px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Enhanced UI Test - Zone Setbacks with Full Citations</h1>
    <div id="results"></div>
    
    <script>
    const testPayload = {
        property_id: 1962876,
        property_zone: 'R2',
        lot_area: 500,
        lot_geometry: {
            hasM: false,
            hasZ: false,
            rings: [[[333165.32, 6246431.73], [333165.32, 6246451.73], [333185.32, 6246451.73], [333185.32, 6246431.73], [333165.32, 6246431.73]]],
            spatialReference: { wkid: 28356, latestWkid: 28356 }
        }
    };

    fetch('http://localhost:3007/api/setbacks/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(testPayload)
    })
    .then(response => response.json())
    .then(data => {
        let html = '<h2>API Response:</h2>';
        html += '<p><strong>Success:</strong> ' + data.success + '</p>';
        html += '<p><strong>Processing Method:</strong> ' + data.processing_method + '</p>';
        html += '<p><strong>Results:</strong> ' + (data.setback_results?.length || 0) + ' setback rules found</p>';
        
        if (data.setback_results && data.setback_results.length > 0) {
            html += '<h3>Enhanced Setback Results with Citations:</h3>';
            
            data.setback_results.forEach((result, i) => {
                const boundaryClass = result.boundary_type.replace('_', '-');
                const confidenceClass = result.confidence >= 0.8 ? 'confidence-high' : 
                                      result.confidence >= 0.6 ? 'confidence-medium' : 'confidence-low';
                const precedenceClass = `precedence-${result.precedence || 3}`;
                
                html += `<div class="result ${boundaryClass}">`;
                html += `<h4>🏘️ ${result.boundary_type.replace('_', ' ').toUpperCase()} SETBACK</h4>`;
                html += `<div class="authority-badge ${precedenceClass}">${result.authority || 'DCP'} • Level ${result.precedence || 3}</div>`;
                
                html += `<div style="font-size: 24px; font-weight: bold; margin: 8px 0;">${result.required_setback}m Required</div>`;
                
                // Legal Context
                if (result.legal_context) {
                    html += `<div class="explanation"><strong>What this means:</strong><br>${result.legal_context}</div>`;
                }
                
                // Requirement Explanation  
                if (result.reasoning) {
                    html += `<div class="explanation"><strong>Requirement:</strong><br>${result.reasoning}</div>`;
                }
                
                // Authority Explanation
                if (result.authority_explanation) {
                    html += `<div class="explanation"><strong>Legal Authority:</strong><br>${result.authority_explanation}</div>`;
                }
                
                // Full Clause Citation
                if (result.full_clause_text) {
                    html += `<details style="margin: 10px 0;">`;
                    html += `<summary style="cursor: pointer; font-weight: bold;">📋 View Full Legal Clause (${result.clause_reference || 'N/A'})</summary>`;
                    html += `<div class="clause-citation">`;
                    html += `<div style="font-size: 12px; color: #666; margin-bottom: 8px;">`;
                    html += `<strong>Source:</strong> ${result.legal_source || 'N/A'}`;
                    if (result.document_section) html += ` • Section: ${result.document_section}`;
                    if (result.page_number) html += ` • Page: ${result.page_number}`;
                    html += `</div>`;
                    html += `<div style="background: white; padding: 8px; border-radius: 4px;">"${result.full_clause_text}"</div>`;
                    html += `</div></details>`;
                }
                
                // Conditions and Confidence
                html += `<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid #ddd;">`;
                if (result.conditions) {
                    html += `<div style="font-size: 12px; color: #666;"><strong>Conditions:</strong> ${result.conditions}</div>`;
                }
                html += `<div class="${confidenceClass}" style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">`;
                html += `${Math.round(result.confidence >= 1 ? result.confidence : result.confidence * 100)}% Confidence`;
                html += `</div></div>`;
                
                html += '</div>';
            });
        } else {
            html += '<p style="color: orange;">No setback rules found for this zone.</p>';
        }
        
        if (data.error) {
            html += '<p style="color: red;"><strong>Error:</strong> ' + data.error + '</p>';
        }
        
        document.getElementById('results').innerHTML = html;
    })
    .catch(error => {
        document.getElementById('results').innerHTML = '<p style="color: red;">Network Error: ' + error + '</p>';
        console.error('Fetch error:', error);
    });
    </script>
</body>
</html>
