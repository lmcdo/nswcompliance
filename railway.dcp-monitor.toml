# Railway config-as-code for the `dcp-monitor` (byte-change) cron service.
# Point the service's "Config Path" (Settings > Config as code) at this file.
# Still set per-service env in the dashboard:
#   MONITOR_NAME=dcp-monitor, DATABASE_URL, R2_ACCOUNT_ID, R2_BUCKET_NAME,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   (optional) HC_PING_URL.
#
# Runs r2_monitor.py: byte-level change detection across all councils' DCP PDFs.
# DEMOTED to a secondary signal. The primary detector is now dcp-extract-all
# (scheduled re-extract-all + diff vs approved baseline). Byte-change is noisy in
# both directions (re-exports false-positive; silent in-place edits false-negative),
# so it no longer drives detection — it is a cheap early heads-up only. Combined with
# the #618 alerting fix (transient/WAF failures bucketed out of the exit-1 page),
# this brings its cadence under review and cuts single-IP rate-limit pressure.
[build]
# Rebuild when anything this image COPYs changes. Railway's dashboard list was hand-picked and
# missed council_quote.py, so the #1582 fix never deployed. Kept equal to the COPY lines by
# tests/test_dockerfile_monitors_imports.py::test_every_monitors_service_watches_what_the_image_copies
watchPatterns = [
    "Dockerfile.monitors",
    "railway.dcp-monitor.toml",
    "scripts/requirements-monitor.txt",
    "scripts/satellite_freshness_monitor.py",
    "scripts/legislation_monitor.py",
    "scripts/pco_client.py",
    "scripts/regulatory_freshness_monitor.py",
    "scripts/r2_monitor.py",
    "scripts/verifyops_record.py",
    "scripts/verifyops_links.py",
    "scripts/verifyops_classify.py",
    "scripts/extract_dcp_stated_dates.py",
    "scripts/pdf_text_hash.py",
    "scripts/dcp_watchdog.py",
    "scripts/hub_scrapers/**",
    "scripts/run_monitors.py",
    "scripts/probe_blocked_councils.py",
    "scripts/dcp_extract_changed.py",
    "scripts/dcp_commit_approved.py",
    "scripts/dcp_staged.py",
    "scripts/pipeline_run.py",
    "scripts/council_quote.py",
    "scripts/council_quote_db.py",
    "scripts/council_quote_table.py",
    "scripts/council_quote_picture.py",
    "scripts/derive_precinct_keys.py",
    "scripts/never_serve.py",
    "scripts/gate_rules.py",
    "scripts/gate_rules_roads.py",
    "scripts/gate_rules_areas.py",
    "scripts/dcp_area_link_guard.py",
    "data/cos_precinct_page_ranges.json",
    "scripts/verify_dcp_formatting.py",
    "scripts/dcp_quality_report.py",
    "scripts/ai_extractor.py",
    "scripts/dcp_page_map_gate.py",
    "scripts/dcp_toc_parse.py",
    "scripts/dcp_fidelity_gate.py",
    "scripts/verify_extraction_fidelity.py",
    "scripts/citation_proof.py",
    "scripts/pdf_picture_labels.py",
    "scripts/page_coverage.py",
    "scripts/dcp_citation_status.py",
    "scripts/dcp_setback_citation_status.py",
    "scripts/dq_probe_section_code_not_in_source.py",
    "scripts/dcp_page_repair.py",
    "scripts/rule_page_locator.py",
    "scripts/dq_probe_live.py",
    "data/chapter_scope/**",
    "scripts/dq_db.py",
    "scripts/qa_report_path.py",
    "scripts/outreach_claim_checks.py",
    "scripts/conveyancing_db.py",
    "scripts/outreach_flood_depth_probe.py",
    "scripts/outreach_scoped_councils.py",
    "scripts/plan_brief_checks.py",
    "scripts/dq_probe_applicability_config.py",
    "services/extracted_data_integrity.py",
    "scripts/dcp_section_code.py",
    "scripts/dcp_supersede_guard.py",
    "scripts/dcp_chapter_measure.py",
    "enrichment/**",
    "scripts/validate_zone_code_validity.py",
    "scripts/check_council_completeness.py",
    "scripts/council_completeness_rules.py",
    "scripts/audit_precinct_keying_coverage.py",
    "scripts/run_alerts_dispatch.py",
    "services/threat_radar.py",
    "services/audit_trail.py",
]
dockerfilePath = "Dockerfile.monitors"

[deploy]
startCommand = "python scripts/run_monitors.py"
cronSchedule = "0 2 * * *"   # daily, 02:00 UTC (VerifyOps v7 step 3, 2026-10-23)
# Daily so a council change behind a served rule is seen within 1 day (v7 purpose). DQ-117's window
# (3 days) and tests/test_one_outcome_alarm.py are derived from this value; the live Railway value
# must match (CI step "Railway cron matches config-as-code").
# Was monthly. Raised to fortnightly 2026-09-10 after measuring the real change
# rate: excluding the March and May 2026 onboarding spikes, 15-30 of 564 active
# chapters change per month (~3-5%), so something changes most weeks but any one
# chapter rarely. Monthly meant up to 30 days of staleness on a change that
# matters; weekly doubles single-IP rate-limit pressure for little gain. A
# fortnight caps staleness at 14 days.
#
# NOTE the live Railway value overrode this file for months without anyone
# noticing: on 2026-09-10 six of eight services ran a different schedule from
# their own config file (dcp-extract weekly when the file said daily,
# dcp-extract-all weekly when the file said quarterly, and four with no cron at
# all). Config-as-code only wins where no dashboard value is set. Changing this
# file is NOT sufficient on its own -- check the live value afterwards.
restartPolicyType = "NEVER"  # cron job: run to completion, do not restart
