# Railway config-as-code for the `dcp-monitor` (byte-change) cron service.
# Point the service's "Config Path" (Settings > Config as code) at this file.
# Still set per-service env in the dashboard:
#   MONITOR_NAME=dcp-monitor, DATABASE_URL, R2_ACCOUNT_ID, R2_BUCKET_NAME,
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#   (optional) HC_PING_URL.
#
# Runs r2_monitor.py: byte-level change detection across all councils' DCP PDFs.
# DEMOTED to a secondary signal. The primary detector is now dcp-extract-all
# (scheduled re-extract-all + diff vs approved baseline). Byte-change is noisy in
# both directions (re-exports false-positive; silent in-place edits false-negative),
# so it no longer drives detection — it is a cheap early heads-up only. Combined with
# the #618 alerting fix (transient/WAF failures bucketed out of the exit-1 page),
# this brings its cadence under review and cuts single-IP rate-limit pressure.
[build]
dockerfilePath = "Dockerfile.monitors"

[deploy]
startCommand = "python scripts/run_monitors.py"
cronSchedule = "0 2 1,15 * *"   # fortnightly: 1st and 15th, 02:00 UTC
# Was monthly. Raised to fortnightly 2026-09-10 after measuring the real change
# rate: excluding the March and May 2026 onboarding spikes, 15-30 of 564 active
# chapters change per month (~3-5%), so something changes most weeks but any one
# chapter rarely. Monthly meant up to 30 days of staleness on a change that
# matters; weekly doubles single-IP rate-limit pressure for little gain. A
# fortnight caps staleness at 14 days.
#
# NOTE the live Railway value overrode this file for months without anyone
# noticing: on 2026-09-10 six of eight services ran a different schedule from
# their own config file (dcp-extract weekly when the file said daily,
# dcp-extract-all weekly when the file said quarterly, and four with no cron at
# all). Config-as-code only wins where no dashboard value is set. Changing this
# file is NOT sufficient on its own -- check the live value afterwards.
restartPolicyType = "NEVER"  # cron job: run to completion, do not restart
