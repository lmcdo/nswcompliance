# PRP-A3: Kubernetes Production Deployment
# Cloud-native deployment for AWS EKS, Azure AKS, GCP GKE

apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-engine
  namespace: nsw-compliance
  labels:
    app: compliance-engine
    version: v1
    component: application
    part-of: nsw-compliance-system
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: compliance-engine
  template:
    metadata:
      labels:
        app: compliance-engine
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/health/metrics"
    spec:
      serviceAccountName: compliance-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      # Pod anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - compliance-engine
              topologyKey: kubernetes.io/hostname

      containers:
      - name: compliance-engine
        image: compliance-engine:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Environment variables
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"

        # PRP-A2 Architecture
        - name: COMPLIANCE_ARCHITECTURE
          value: "direct_database"
        - name: USE_DIRECT_DATABASE
          value: "true"

        # Database connection
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: compliance-engine-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: compliance-engine-config
              key: db-port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: compliance-engine-config
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: password

        # Connection pooling
        - name: DB_POOL_MIN
          value: "2"
        - name: DB_POOL_MAX
          value: "20"
        - name: DB_IDLE_TIMEOUT
          value: "30000"
        - name: DB_CONNECTION_TIMEOUT
          value: "2000"

        # Redis connection
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: compliance-engine-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: compliance-engine-config
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password

        # API Keys
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: google-maps
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: openai
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: deepseek
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: gemini

        # JWT Security
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: refresh-secret

        # Monitoring and logging
        - name: METRICS_ENABLED
          value: "true"
        - name: PROMETHEUS_ENABLED
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        - name: AUDIT_LOGGING_ENABLED
          value: "true"

        # Performance optimization
        - name: CACHE_ENABLED
          value: "true"
        - name: COMPRESSION_ENABLED
          value: "true"
        - name: PERFORMANCE_MODE
          value: "true"

        # Resource limits
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health?type=liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health?type=readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe for slow initialization
        startupProbe:
          httpGet:
            path: /api/health?type=liveness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12 # Allow up to 2 minutes for startup

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: cache
          mountPath: /app/.next/cache

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: cache
        emptyDir: {}

      # DNS configuration
      dnsPolicy: ClusterFirst
      restartPolicy: Always

      # Graceful shutdown
      terminationGracePeriodSeconds: 30

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-engine-sa
  namespace: nsw-compliance
  labels:
    app: compliance-engine

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: compliance-engine-service
  namespace: nsw-compliance
  labels:
    app: compliance-engine
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/health/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: compliance-engine

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliance-engine-hpa
  namespace: nsw-compliance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliance-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliance-engine-pdb
  namespace: nsw-compliance
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: compliance-engine